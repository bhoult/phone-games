[workspace]
resolver = "2"
members = ["core", "game"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The build script rasterises all the SVG art; do that with optimisations on.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
