<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biome Defense</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biome Defense">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; position: fixed; inset: 0;
    background: #0b0d0a;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas#glcanvas {
    -webkit-user-select: none; user-select: none;
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; outline: none; touch-action: none;
  }
  /* Measured from Rust so the HUD keeps clear of notches and home bars. */
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: #0b0d0a;
    color: #e9e2d0; font: 600 13px Georgia, "Times New Roman", serif; text-align: center;
    letter-spacing: .34em; text-transform: uppercase;
    transition: opacity .5s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .bar { width: 120px; height: 1px; background: rgba(233, 226, 208, .22); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #d9b25a; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #splash small { display: block; margin-top: 10px; letter-spacing: .08em; text-transform: none; opacity: .6; font-size: 12px; font-weight: 400; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<div id="safe"></div>
<div id="splash">
  <div>Biome Defense<small id="splash-msg">loading</small></div>
  <div class="bar"><i></i></div>
</div>
<script>
  // Keep hold of the audio contexts the engine creates, so sound can be
  // paused when the game is in the background (see biome.js).
  (function () {
    var Real = window.AudioContext || window.webkitAudioContext;
    window.biomeAudio = [];
    if (!Real) return;
    function Tracked() {
      var ctx = new Real();
      window.biomeAudio.push(ctx);
      return ctx;
    }
    Tracked.prototype = Real.prototype;
    window.AudioContext = Tracked;
    window.webkitAudioContext = Tracked;
  })();
</script>
<script src="engine.js"></script>
<script src="biome.js"></script>
<script>
  load("biome-defense.wasm");
</script>
</body>
</html>
