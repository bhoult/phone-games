<svg xmlns="http://www.w3.org/2000/svg" width="224" height="224" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9713e"/><stop offset="1" stop-color="#a84624"/></linearGradient>
    <radialGradient id="sand" cx="45%" cy="20%" r="85%"><stop offset="0" stop-color="#f8dc9c"/><stop offset="1" stop-color="#d6a45a"/></radialGradient>
    <radialGradient id="hole" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#1c0f08"/><stop offset="1" stop-color="#3f2413"/></radialGradient>
