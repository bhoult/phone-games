  <path d="M38 87 Q50 85.4 60 86.6" fill="none" stroke="#fff6e2" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <!-- a small cactus -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83 82 V60 M83 73 H76.4 V66 M83 69 H89.6 V62.6" stroke="#2c6e2e" stroke-width="8.6"/>
    <path d="M83 82 V60 M83 73 H76.4 V66 M83 69 H89.6 V62.6" stroke="#68bd5c" stroke-width="5.2"/>
    <path d="M81.6 63 V79" stroke="#b4eaa0" stroke-width="1.4" opacity="0.8"/>
  </g>
  <circle cx="83" cy="56" r="2.8" fill="#ff7fa8" stroke="#b83a66" stroke-width="1.2"/>
  <!-- pebbles and a tuft of dry grass -->
  <g fill="#d9b88a" stroke="#8a6238" stroke-width="1.4"><ellipse cx="17" cy="80" rx="4.4" ry="3"/><ellipse cx="24.6" cy="83.6" rx="2.8" ry="2"/></g>
  <path d="M13 74 L10.6 67 M14.6 74 L15 66 M16 74 L19.4 68" fill="none" stroke="#b08a3a" stroke-width="1.6" stroke-linecap="round"/>
