  <path d="M21 33 L41 26.6 L62 27.4" fill="none" stroke="#ffd2ac" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M12 49 L27 51.6 L71 51.6 L90 46 M30 56 H50 M58 47.6 H74" fill="none" stroke="#6e2a12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
