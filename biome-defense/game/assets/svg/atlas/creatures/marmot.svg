    <circle cx="28" cy="13" r="5.8" fill="#c28c34" stroke="#5e3c10" stroke-width="3.2"/><circle cx="28.6" cy="13.6" r="2.4" fill="#7a5220"/>
    <circle cx="72" cy="13" r="5.8" fill="#c28c34" stroke="#5e3c10" stroke-width="3.2"/><circle cx="71.4" cy="13.6" r="2.4" fill="#7a5220"/>
