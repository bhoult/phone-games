    <path d="M50 6 C66 6 78 16 78 28 C78 40 66 48 50 48 C34 48 22 40 22 28 C22 16 34 6 50 6 Z" fill="url(#h)" stroke="#5e3c10" stroke-width="3.2" stroke-linejoin="round"/>
