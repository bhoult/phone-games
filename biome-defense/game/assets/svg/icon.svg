<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The app icon: Rust the fox in the meadow, a thistle shooter at his side.
       The fox and the thistle are the game's own sprites, placed here. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd6f4"/><stop offset="0.62" stop-color="#d8f2c0"/><stop offset="1" stop-color="#bfe89a"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6b8" stop-opacity="0.95"/><stop offset="1" stop-color="#fff6b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdc5a"/><stop offset="1" stop-color="#4f9e3a"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a45"/><stop offset="1" stop-color="#d6591a"/></linearGradient>
    <radialGradient id="h" cx="42%" cy="34%" r="75%"><stop offset="0" stop-color="#ffa451"/><stop offset="1" stop-color="#e2661f"/></radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f08a36"/><stop offset="1" stop-color="#cf5a1a"/></linearGradient>
    <radialGradient id="tf" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#f08af0"/><stop offset="1" stop-color="#a23fc0"/></radialGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6fc04a"/><stop offset="1" stop-color="#3c8a2c"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="250" fill="url(#glow)"/>
  <path d="M0 330 Q120 286 256 316 T512 300 V512 H0 Z" fill="#6fba48"/>
  <path d="M0 372 Q140 330 280 362 T512 350 V512 H0 Z" fill="url(#hill)"/>
  <path d="M190 512 C200 450 250 420 330 400 C380 388 420 380 440 360" fill="none" stroke="#a88448" stroke-width="62" stroke-linecap="round"/>
  <path d="M190 512 C200 450 250 420 330 400 C380 388 420 380 440 360" fill="none" stroke="#e2c184" stroke-width="46" stroke-linecap="round"/>
  <g transform="translate(330 250) scale(1.9)">
  
  <!-- leaves at the base -->
  <path d="M50 84 C34 86 20 78 12 66 C26 64 40 70 50 84 Z" fill="#4fa838" stroke="#22561a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 84 C66 86 80 78 88 66 C74 64 60 70 50 84 Z" fill="#4fa838" stroke="#22561a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 70 L28 66 M30 76 L34 70 M78 70 L72 66 M70 76 L66 70" stroke="#22561a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- stem -->
  <path d="M45 86 C44 70 44 58 46 46 L54 46 C56 58 56 70 55 86 Z" fill="url(#ts)" stroke="#22561a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 66 L37 62 M56 60 L63 56 M44 76 L38 74" stroke="#22561a" stroke-width="2.6" stroke-linecap="round"/>
  <!-- the bulb, bristling -->
  <g stroke="#22561a" stroke-width="2.6" stroke-linecap="round">
    <path d="M30 44 L22 40 M29 36 L21 30 M33 50 L26 52 M70 44 L78 40 M71 36 L79 30 M67 50 L74 52"/>
  </g>
  <path d="M30 46 C28 34 36 28 50 28 C64 28 72 34 70 46 C68 54 60 58 50 58 C40 58 32 54 30 46 Z" fill="#5fb845" stroke="#22561a" stroke-width="3"/>
  <path d="M36 40 L42 46 M46 36 L50 44 M56 36 L54 44 M64 40 L58 46 M38 50 L44 52 M62 50 L56 52" stroke="#2f7a25" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the flower: a crown of darts -->
  <path d="M32 30 L26 10 L38 22 L40 4 L47 20 L50 2 L53 20 L60 4 L62 22 L74 10 L68 30 C62 34 38 34 32 30 Z" fill="url(#tf)" stroke="#6a1f86" stroke-width="3" stroke-linejoin="round"/>
  <path d="M40 24 L41 14 M50 22 L50 12 M60 24 L59 14" stroke="#ffd6ff" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
</g>
  <ellipse cx="226" cy="446" rx="120" ry="24" fill="#000" opacity="0.2"/>
  <g transform="translate(46 96) scale(3.7)">
  
  <!-- tail -->
  <path d="M66 86 C86 90 98 76 95 60 C93 49 96 40 88 33 C80 27 70 32 71 42 C72 50 77 53 76 62 C75 72 68 76 66 86 Z" fill="url(#t)" stroke="#8a350c" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M88 33 C80 27 70 32 71 42 C72 47 75 50 76 54 C83 52 91 45 93 38 C92 36 90 34 88 33 Z" fill="#fff6e6" stroke="#8a350c" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- body -->
  <path d="M30 92 C26 76 32 62 48 60 C64 62 70 76 66 92 Z" fill="url(#b)" stroke="#8a350c" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M40 92 C38 80 41 70 48 68 C55 70 58 80 56 92 Z" fill="#fff6e6"/>
  <!-- paws -->
  <ellipse cx="37" cy="92" rx="8" ry="5" fill="#4a2410" stroke="#2c1407" stroke-width="2.4"/>
  <ellipse cx="59" cy="92" rx="8" ry="5" fill="#4a2410" stroke="#2c1407" stroke-width="2.4"/>
  <!-- ears -->
  <path d="M15 34 C11 18 15 7 21 4 C30 9 37 18 39 28 Z" fill="#e8702a" stroke="#8a350c" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M81 34 C85 18 81 7 75 4 C66 9 59 18 57 28 Z" fill="#e8702a" stroke="#8a350c" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M19 28 C17 19 19 12 22 9 C27 13 31 19 33 25 Z" fill="#3c1e0e"/>
  <path d="M77 28 C79 19 77 12 74 9 C69 13 65 19 63 25 Z" fill="#3c1e0e"/>
  <!-- head -->
  <path d="M48 20 C70 20 86 34 86 48 C86 56 78 62 70 66 C62 72 56 76 48 76 C40 76 34 72 26 66 C18 62 10 56 10 48 C10 34 26 20 48 20 Z" fill="url(#h)" stroke="#8a350c" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- cheeks and muzzle -->
  <path d="M11 50 C16 58 22 63 28 66 C34 71 40 75 48 75 C56 75 62 71 68 66 C74 63 80 58 85 50 C76 52 66 54 60 58 C54 54 52 50 48 50 C44 50 42 54 36 58 C30 54 20 52 11 50 Z" fill="#fff6e6"/>
  <!-- eyes -->
  <ellipse cx="33" cy="46" rx="6.2" ry="7" fill="#2a1608"/>
  <circle cx="35.2" cy="43.4" r="2.5" fill="#fff"/>
  <ellipse cx="63" cy="46" rx="6.2" ry="7" fill="#2a1608"/>
  <circle cx="65.2" cy="43.4" r="2.5" fill="#fff"/>
  <path d="M24 37 Q32 33 40 37" fill="none" stroke="#8a350c" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M56 37 Q64 33 72 37" fill="none" stroke="#8a350c" stroke-width="2.4" stroke-linecap="round"/>
  <!-- nose and smile -->
  <path d="M43 58 Q48 55 53 58 Q52 64 48 65 Q44 64 43 58 Z" fill="#2a1608"/>
  <path d="M40 67 Q44 71 48 67 Q52 71 56 67" fill="none" stroke="#8a350c" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M30 26 Q40 21 52 22" fill="none" stroke="#ffd0a0" stroke-width="3.4" stroke-linecap="round" opacity="0.8"/>
</g>
</svg>
