  <path d="M150 100 C156 88 168 82 182 84 C190 85 190 95 183 96 C174 98 166 102 160 110 Z" fill="#25262d" stroke="#08080b" stroke-width="3.5" stroke-linejoin="round"/>
  <g transform="translate(0 -9)">
  <!-- the lake, up to his chin -->
  <path d="M6 104 Q16 106 28 100 T52 100 T76 100 T100 100 T124 100 T148 100 T172 100 T196 100 T220 100 Q232 102 232 110 Q230 128 119 129 Q8 128 6 110 Z" fill="#8fd6ff" opacity="0.93"/>
  <path d="M22 110 q12 -7 24 0 M70 116 q12 -7 24 0 M120 110 q12 -7 24 0 M168 116 q12 -7 24 0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g fill="#fff"><circle cx="192" cy="80" r="3.4"/><circle cx="200" cy="92" r="4.4"/><circle cx="24" cy="88" r="3.6"/><circle cx="14" cy="98" r="2.6"/></g>
</svg>
