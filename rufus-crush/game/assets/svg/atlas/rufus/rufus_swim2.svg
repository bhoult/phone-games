  <path d="M58 72 Q100 56 148 66" fill="none" stroke="#5b6076" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M158 44 L171 82 L161 86 L148 50 Z" fill="#ef3340" stroke="#7d0f1b" stroke-width="2.6" stroke-linejoin="round"/>
  <g transform="translate(0 4)">
    <ellipse cx="184" cy="48" rx="29" ry="24" fill="#25262d" stroke="#08080b" stroke-width="3.5"/>
    <path d="M196 40 C214 36 233 43 235 54 C236 63 222 68 204 66 Z" fill="#353741" stroke="#08080b" stroke-width="3.5" stroke-linejoin="round"/>
