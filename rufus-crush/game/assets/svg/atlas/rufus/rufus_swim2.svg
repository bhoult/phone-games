    <circle cx="198" cy="40" r="7.5" fill="#fff" stroke="#040405" stroke-width="2.2"/>
    <circle cx="200.5" cy="39.5" r="3.6" fill="#040405"/>
    <path d="M178 34 C164 22 148 22 140 34 C148 44 162 48 176 46 Z" fill="#1a1b21" stroke="#08080b" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M168 30 Q180 24 194 28" fill="none" stroke="#5b6076" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <!-- the stick. He is not letting go of the stick. -->
    <g stroke-linecap="round">
      <path d="M204 44 L229 84" stroke="#4a2a10" stroke-width="12"/>
      <path d="M204 44 L229 84" stroke="#b9773c" stroke-width="6.5"/>
      <path d="M206 46 L216 62" stroke="#f3c88a" stroke-width="2.2" opacity="0.8"/>
    </g>
    <path d="M203 52 C213 50 226 52 233 58 C230 65 216 68 204 66 Z" fill="#353741" stroke="#08080b" stroke-width="3" stroke-linejoin="round"/>
  </g>
